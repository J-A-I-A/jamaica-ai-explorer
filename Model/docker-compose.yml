name: qwen35

services:
  qwen:
    # Pin LLAMA_IMAGE to a digest in production so restarts cannot change the server version.
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    container_name: qwen35-0.8b
    restart: unless-stopped
    ports:
      # Localhost only by default. Set BIND_ADDRESS=0.0.0.0 to expose it (set API_KEY first).
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      # GGUF is downloaded from Hugging Face on first start and cached in the volume.
      LLAMA_CACHE: /models
      # Empty means no authentication. Several keys can be given, comma-separated.
      LLAMA_API_KEY: ${API_KEY:-}
      # Set OFFLINE=1 once the model is cached to block all downloads at start-up.
      LLAMA_ARG_OFFLINE: ${OFFLINE:-0}
      # Prometheus metrics at /metrics (requires the API key when one is set).
      LLAMA_ARG_ENDPOINT_METRICS: "1"
    volumes:
      - models:/models
    command:
      - --hf-repo
      - ${MODEL:-unsloth/Qwen3.5-0.8B-GGUF:UD-Q4_K_XL}
      - --alias
      - qwen3.5-0.8b
      - --port
      - "8080"
      - --jinja
      # Thinking off by default (loop-prone on the 0.8B model). Per request, send
      # "chat_template_kwargs": {"enable_thinking": true} to turn it on.
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
      # Concurrent request slots. The context is shared across slots, so keep
      # CTX_SIZE >= PARALLEL x (document + question + answer tokens).
      - --parallel
      - "${PARALLEL:-4}"
      - --ctx-size
      - "${CTX_SIZE:-32768}"
      - --threads
      - "${THREADS:-6}"
      # CPU only
      - --n-gpu-layers
      - "0"
      # Qwen3.5 recommended defaults for non-thinking text; clients can override per request.
      - --temp
      - "1.0"
      - --top-p
      - "1.0"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --presence-penalty
      - "2.0"

volumes:
  models:
